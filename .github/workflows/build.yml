name: TqDz System Xcode Build
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Tên ứng dụng'
        default: 'AppVIP'
      web_url:
        description: 'Link website (nếu không dùng file local)'
        default: ''
      use_local_html:
        description: 'Sử dụng file index.html tải lên'
        default: 'false'

# Cấp quyền ghi để tạo Release và đẩy file IPA
permissions:
  contents: write 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Source
        uses: actions/checkout@v4
      
      - name: 2. Cài đặt XcodeGen
        run: brew install xcodegen

      - name: 3. Khởi tạo cấu trúc Project (TqDz Engine)
        run: |
          # Lọc tên App: Xóa ký tự đặc biệt để làm ID hệ thống
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr -dc 'a-zA-Z0-9')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="AppVIP"; fi

          mkdir -p AppSource
          
          # TẠO FILE CẤU HÌNH PROJECT.YML
          cat << EOF > project.yml
          name: $SAFE_NAME
          options:
            bundleIdPrefix: com.tqdz.build
          targets:
            $SAFE_NAME:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [AppSource]
              info:
                path: AppSource/Info.plist
                properties:
                  UILaunchStoryboardName: LaunchScreen
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
          EOF

          # TẠO APP DELEGATE (Lõi xử lý WebView)
          cat << 'EOF' > AppSource/AppDelegate.swift
          import UIKit
          import WebKit

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  let webView = WKWebView(frame: UIScreen.main.bounds)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.scrollView.bounces = false
                  
                  let useLocal = "${{ github.event.inputs.use_local_html }}" == "true"
                  let webUrl = "${{ github.event.inputs.web_url }}"
                  
                  if useLocal {
                      if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html") {
                          let url = URL(fileURLWithPath: htmlPath)
                          webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                      } else {
                          webView.loadHTMLString("<h1 style='text-align:center;margin-top:50%;'>Hệ thống TqDz: Chưa tìm thấy file index.html</h1>", baseURL: nil)
                      }
                  } else if let url = URL(string: webUrl) {
                      webView.load(URLRequest(url: url))
                  }
                  
                  vc.view.addSubview(webView)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF
          
          # KHAI BÁO INFO.PLIST
          cat << EOF > AppSource/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${{ github.event.inputs.app_name }}</string>
              <key>CFBundleDisplayName</key>
              <string>${{ github.event.inputs.app_name }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.tqdz.$SAFE_NAME.${{ github.run_id }}</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # TẠO MÀN HÌNH CHỜ (LAUNCH SCREEN)
          cat << 'EOF' > AppSource/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF

      - name: 4. Xử lý Icon & HTML (Fix lỗi Icon trắng)
        run: |
          mkdir -p AppSource/Assets.xcassets/AppIcon.appiconset
          
          # Tạo file Contents.json chuẩn Apple cho AppIcon
          cat << 'EOF' > AppSource/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              { "idiom" : "universal", "filename" : "icon.png", "scale" : "1x" },
              { "idiom" : "universal", "filename" : "icon.png", "scale" : "2x" },
              { "idiom" : "universal", "filename" : "icon.png", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          
          # Kiểm tra và nạp file Icon từ Bot (phải là tên icon.png)
          if [ -f "icon.png" ]; then
            cp icon.png AppSource/Assets.xcassets/AppIcon.appiconset/
          fi

          # Kiểm tra và nạp file HTML nếu có
          if [ "${{ github.event.inputs.use_local_html }}" == "true" ] && [ -f "index.html" ]; then
            cp index.html AppSource/
          fi
          
          # Chạy XcodeGen để dựng Project
          xcodegen generate

      - name: 5. Biên dịch & Đóng gói IPA
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr -dc 'a-zA-Z0-9')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="AppVIP"; fi

          # Build ứng dụng sang file .app
          xcodebuild -project "$SAFE_NAME.xcodeproj" \
                     -scheme "$SAFE_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SYMROOT=$(pwd)/build build
          
          # Tạo cấu trúc Payload để nén IPA
          mkdir -p Payload
          if [ -d "build/Release-iphoneos/$SAFE_NAME.app" ]; then
            cp -r "build/Release-iphoneos/$SAFE_NAME.app" Payload/
            zip -vr "${APP_NAME}.ipa" Payload/
          else
            echo "❌ Lỗi: Không tìm thấy file build .app"
            exit 1
          fi

      - name: 6. Đẩy file lên Release (Để Bot Telegram lấy về)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Sản phẩm của TqDz: ${{ github.event.inputs.app_name }}"
          files: ./*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
