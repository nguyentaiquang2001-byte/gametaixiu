name: TqDz MAXIMA iOS Builder
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Tên ứng dụng'
        default: 'TqDzApp'
      web_url:
        description: 'Link website (nếu không dùng file local)'
        default: ''
      use_local_html:
        description: 'Sử dụng file index.html tải lên'
        default: 'false'

permissions:
  contents: write 

jobs:
  build:
    name: Build & Encrypt IPA
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
      
      - name: 2. Cài đặt Công Cụ (XcodeGen & Ldid)
        run: |
          brew install xcodegen
          brew install ldid

      - name: 3. Khởi tạo cấu trúc TqDz VIP Engine
        run: |
          # Lọc tên App: Xóa ký tự đặc biệt, khoảng trắng để làm ID hệ thống (Chống Crash)
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr -dc 'a-zA-Z0-9')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="TqDzApp"; fi

          mkdir -p AppSource
          
          # TẠO FILE CẤU HÌNH PROJECT.YML CHUẨN
          cat << EOF > project.yml
          name: $SAFE_NAME
          options:
            bundleIdPrefix: com.tqdz.maxima
          targets:
            $SAFE_NAME:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [AppSource]
              info:
                path: AppSource/Info.plist
                properties:
                  UILaunchStoryboardName: LaunchScreen
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIRequiresFullScreen: true
          EOF

          # TẠO APP DELEGATE (Lõi WebView - Native Feel & Dark Mode)
          cat << 'EOF' > AppSource/AppDelegate.swift
          import UIKit
          import WebKit

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  
                  // Ép Dark Mode cực xịn
                  window?.overrideUserInterfaceStyle = .dark
                  
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  
                  // Cấu hình chống Zoom & Ép tỷ lệ hiển thị
                  let config = WKWebViewConfiguration()
                  let scriptSource = """
                      var meta = document.createElement('meta');
                      meta.name = 'viewport';
                      meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
                      document.getElementsByTagName('head')[0].appendChild(meta);
                  """
                  let script = WKUserScript(source: scriptSource, injectionTime: .atDocumentEnd, forMainFrameOnly: true)
                  config.userContentController.addUserScript(script)
                  
                  let webView = WKWebView(frame: UIScreen.main.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  
                  // Tắt độ nảy để giống App thật
                  webView.scrollView.bounces = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  webView.isOpaque = false
                  webView.backgroundColor = .black
                  
                  let useLocal = "${{ github.event.inputs.use_local_html }}" == "true"
                  let webUrl = "${{ github.event.inputs.web_url }}"
                  
                  if useLocal {
                      if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html") {
                          let url = URL(fileURLWithPath: htmlPath)
                          webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                      } else {
                          webView.loadHTMLString("<h1 style='text-align:center;margin-top:50%;color:gold;'>TqDz Engine: Missing index.html</h1>", baseURL: nil)
                      }
                  } else if let url = URL(string: webUrl) {
                      webView.load(URLRequest(url: url))
                  }
                  
                  vc.view.addSubview(webView)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF
          
          # KHAI BÁO INFO.PLIST
          cat << EOF > AppSource/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${{ github.event.inputs.app_name }}</string>
              <key>CFBundleDisplayName</key>
              <string>${{ github.event.inputs.app_name }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.tqdz.$SAFE_NAME.${{ github.run_id }}</string>
              <key>CFBundleShortVersionString</key>
              <string>MAXIMA.1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleLightContent</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # TẠO MÀN HÌNH CHỜ (Đen trơn đồng bộ Dark Mode)
          cat << 'EOF' > AppSource/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" white="0.0" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF

      - name: 4. Xử lý Tài nguyên (Icon, HTML)
        run: |
          mkdir -p AppSource/Assets.xcassets/AppIcon.appiconset
          
          # Nội dung Contents.json chuẩn Apple
          cat << 'EOF' > AppSource/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              { "idiom" : "universal", "filename" : "icon.png", "scale" : "1x" },
              { "idiom" : "universal", "filename" : "icon.png", "scale" : "2x" },
              { "idiom" : "universal", "filename" : "icon.png", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          
          # Fix đồng bộ tên Icon từ Bot Telegram (AppIcon.png -> icon.png)
          if [ -f "AppIcon.png" ]; then
            cp AppIcon.png AppSource/Assets.xcassets/AppIcon.appiconset/icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png AppSource/Assets.xcassets/AppIcon.appiconset/icon.png
          fi

          if [ "${{ github.event.inputs.use_local_html }}" == "true" ] && [ -f "index.html" ]; then
            cp index.html AppSource/
          fi
          
          xcodegen generate

      - name: 5. Biên dịch & Pseudo Sign (Ký Giả Lập)
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr -dc 'a-zA-Z0-9')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="TqDzApp"; fi

          # Build ứng dụng sang file .app
          xcodebuild -project "$SAFE_NAME.xcodeproj" \
                     -scheme "$SAFE_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SYMROOT=$(pwd)/build build
          
          mkdir -p Payload
          if [ -d "build/Release-iphoneos/$SAFE_NAME.app" ]; then
            cp -r "build/Release-iphoneos/$SAFE_NAME.app" Payload/
            
            # KÝ GIẢ LẬP BẰNG LDID ĐỂ CÀI TROLLSTORE / ESIGN KHÔNG BỊ CRASH
            echo "Kích hoạt TqDz Shield - Signing with ldid..."
            ldid -S Payload/$SAFE_NAME.app
            
            zip -vr "${APP_NAME}.ipa" Payload/
          else
            echo "❌ Lỗi: Không tìm thấy file build .app"
            exit 1
          fi

      - name: 6. Cập nhật lên Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "🔥 TqDz MAXIMA: ${{ github.event.inputs.app_name }}"
          body: |
            **Bản dựng hoàn chỉnh từ TqDz Builder System**
            - 🛡 Trạng thái: **Thành công**
            - 📱 Ứng dụng: `${{ github.event.inputs.app_name }}`
            - 🔒 Pseudo Signed: **Sẵn sàng cho ESign/TrollStore**
          files: ./*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
