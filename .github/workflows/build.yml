name: ⚜️ TqDz MAXIMA v4 — Ultra iOS Builder
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "📱 Tên ứng dụng"
        default: "TqModes"
      web_url:
        description: "🌐 Link website (bỏ trống = build thuần)"
        default: ""
      use_local_html:
        description: "📄 Dùng file index.html (true/false)"
        default: "false"
      no_splash:
        description: "⚫ Ẩn splash/loading — vào thẳng app (true/false)"
        default: "false"
      app_version:
        description: "🔢 Phiên bản"
        default: "1.0.0"
      dark_mode:
        description: "🌙 Dark Mode (true/false)"
        default: "true"
      bundle_prefix:
        description: "🆔 Bundle ID prefix"
        default: "com.tqdz.maxima"

permissions:
  contents: write

jobs:
  build:
    name: ⚜️ Build & Package IPA
    runs-on: macos-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      APP_VERSION: ${{ github.event.inputs.app_version }}
      DARK_MODE: ${{ github.event.inputs.dark_mode }}
      BUNDLE_PREFIX: ${{ github.event.inputs.bundle_prefix }}
      NO_SPLASH: ${{ github.event.inputs.no_splash }}

    steps:
      - name: "1️⃣  Checkout"
        uses: actions/checkout@v4

      - name: "2️⃣  Cài công cụ"
        run: |
          brew install xcodegen ldid
          pip3 install pillow requests --break-system-packages 2>/dev/null || pip3 install pillow requests

      - name: "3️⃣  Chuẩn bị môi trường"
        run: |
          SAFE_NAME=$(echo "$APP_NAME" | tr -dc "a-zA-Z0-9")
          [ -z "$SAFE_NAME" ] && SAFE_NAME="TqModes"
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV
          mkdir -p AppSource AppSource/Assets.xcassets/AppIcon.appiconset BuildLogs
          echo "✅ Sẵn sàng: $SAFE_NAME v$APP_VERSION | Pure=$PURE_IPA"

      # ──────────────────────────────────────────────────────────
      # STEP 4: Icon — dùng ảnh TqModes nhúng sẵn (base64)
      # ──────────────────────────────────────────────────────────
      - name: "4️⃣  Xử lý App Icon (TqModes Logo)"
        run: |
          python3 << PYEOF
          import os, base64, hashlib
          from PIL import Image, ImageDraw, ImageFont
          import io

          app_name  = os.environ.get("APP_NAME", "TqModes")
          safe_name = os.environ.get("SAFE_NAME", "TqModes")
          icon_dest = "AppSource/Assets.xcassets/AppIcon.appiconset/icon_1024.png"

          # ── Logo TqModes nhúng sẵn (base64) ──────────────────────
          TQMODES_ICON_B64 = ""

          # Ưu tiên: AppIcon.png từ Bot Telegram
          if os.path.exists("AppIcon.png"):
              print("✅ Dùng icon từ Bot Telegram")
              img = Image.open("AppIcon.png").convert("RGBA").resize((1024,1024), Image.LANCZOS)
              # Viền vàng
              draw = ImageDraw.Draw(img)
              for i in range(16):
                  alpha = int(240*(1-i/16))
                  draw.ellipse([i,i,1023-i,1023-i], outline=(212,175,55,alpha), width=2)
              img.save(icon_dest, "PNG")
              print(f"✅ Icon Bot saved")

          else:
              # Dùng logo TqModes
              print("⚙️ Dùng logo TqModes mặc định")
              raw  = base64.b64decode(TQMODES_ICON_B64)
              img  = Image.open(io.BytesIO(raw)).convert("RGBA").resize((1024,1024), Image.LANCZOS)

              # Overlay tên app nếu khác TqModes
              if app_name.upper() not in ("TQMODES","TQDZ",""):
                  draw = ImageDraw.Draw(img)
                  font_path = "/System/Library/Fonts/Helvetica.ttc"
                  try:   font = ImageFont.truetype(font_path, 90)
                  except: font = ImageFont.load_default()
                  text = app_name
                  try:
                      l,t,r,b = font.getbbox(text)
                      tx = (1024-(r-l))//2 - l
                      ty = 1024 - (b-t) - 30
                  except:
                      tx, ty = 100, 900
                  draw.text((tx+3,ty+3), text, font=font, fill=(0,0,0,150))
                  draw.text((tx,ty),   text, font=font, fill=(212,175,55,220))

              img.save(icon_dest,"PNG")
              img.save("AppIcon_generated.png","PNG")
              print(f"✅ TqModes icon saved")

          # Tạo tất cả kích thước Apple cần
          master = Image.open(icon_dest).convert("RGBA")
          sizes = {
              "icon_20.png":20,"icon_29.png":29,"icon_40.png":40,"icon_58.png":58,
              "icon_60.png":60,"icon_76.png":76,"icon_80.png":80,"icon_87.png":87,
              "icon_120.png":120,"icon_152.png":152,"icon_167.png":167,
              "icon_180.png":180,"icon_1024.png":1024
          }
          base = "AppSource/Assets.xcassets/AppIcon.appiconset/"
          for fname,sz in sizes.items():
              master.resize((sz,sz), Image.LANCZOS).save(base+fname,"PNG")
          print(f"✅ Đã tạo {len(sizes)} kích thước icon")
          PYEOF

      - name: "5️⃣  Icon Asset Catalog"
        run: |
          cat << EOF > AppSource/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"icon_40.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"icon_60.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"icon_58.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"icon_87.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"icon_80.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"icon_120.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"icon_120.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"icon_180.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"icon_20.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"icon_40.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"icon_29.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"icon_58.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"icon_40.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"icon_80.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"icon_76.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"icon_152.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"icon_167.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"icon_1024.png"}
            ],
            "info": {"author":"tqdz-maxima-v4","version":1}
          }
          EOF

      # ──────────────────────────────────────────────────────────
      # STEP 6: Tạo LaunchScreen PNG từ logo nhúng sẵn
      # ──────────────────────────────────────────────────────────
      - name: "6️⃣  Tạo LaunchScreen Resources"
        run: |
          python3 << PYEOF
          import base64, io, os
          from PIL import Image, ImageDraw, ImageFont

          app_name = os.environ.get("APP_NAME","TqModes")

          LAUNCH_B64 = ""

          # Decode ảnh launch
          raw  = base64.b64decode(LAUNCH_B64)
          base = Image.open(io.BytesIO(raw)).convert("RGBA")
          w, h = base.size
          print(f"Launch base: {w}x{h}")

          # Nếu tên app khác thì render lại text
          if app_name.upper() not in ("TQMODES","TQDZ"):
              draw = ImageDraw.Draw(base)
              font_path = "/System/Library/Fonts/Helvetica.ttc"
              try:    font_big = ImageFont.truetype(font_path, 120)
              except: font_big = ImageFont.load_default()
              text = app_name
              try:
                  l,t,r,b = font_big.getbbox(text)
                  tx = (w-(r-l))//2 - l
                  ty = h//2 + 200
              except:
                  tx, ty = 200, h//2+200
              # Xoá vùng text cũ (vẽ hình chữ nhật đen)
              draw.rectangle([0, h//2+150, w, h//2+350], fill=(0,0,0,255))
              draw.text((tx+4,ty+4), text, font=font_big, fill=(100,80,20,200))
              draw.text((tx,ty),     text, font=font_big, fill=(212,175,55,255))

          base.save("AppSource/LaunchImage.png","PNG")
          # Cũng lưu kích thước khác
          sizes = [(1242,2208),(1125,2436),(828,1792),(750,1334)]
          for sw,sh in sizes:
              base.resize((sw,sh), Image.LANCZOS).save(f"AppSource/LaunchImage_{sw}x{sh}.png","PNG")
          print("✅ LaunchImage saved")
          PYEOF

      # ──────────────────────────────────────────────────────────
      # STEP 7: Tạo Xcode Project — 3 chế độ: Pure / Local / URL
      # ──────────────────────────────────────────────────────────
      - name: "7️⃣  Khởi tạo Xcode Project (3 chế độ)"
        run: |
          UI_STYLE=$( [ "$DARK_MODE" = "true" ] && echo ".dark" || echo ".light" )
          UI_PLIST=$( [ "$DARK_MODE" = "true" ] && echo "Dark" || echo "Light" )

          cat << EOF > project.yml
          name: ${SAFE_NAME}
          options:
            bundleIdPrefix: ${BUNDLE_PREFIX}
            deploymentTarget:
              iOS: "15.0"
          targets:
            ${SAFE_NAME}:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: AppSource
                  excludes:
                    - "LaunchImage*.png"
              resources:
                - AppSource/LaunchImage.png
                - AppSource/LaunchImage_1242x2208.png
                - AppSource/LaunchImage_1125x2436.png
                - AppSource/LaunchImage_828x1792.png
                - AppSource/LaunchImage_750x1334.png
              info:
                path: AppSource/Info.plist
                properties:
                  UILaunchStoryboardName: LaunchScreen
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIRequiresFullScreen: true
                  UIUserInterfaceStyle: ${UI_PLIST}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
          EOF

          # ━━━━ AppDelegate.swift ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          cat << SWIFTEOF > AppSource/AppDelegate.swift
          import UIKit
          import WebKit

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate,
                             WKNavigationDelegate, WKUIDelegate {
              var window: UIWindow?
              var webView: WKWebView!
              var progressBar: UIView!
              var splashView: SplashView?

              func application(_ app: UIApplication,
                               didFinishLaunchingWithOptions opts: [UIApplication.LaunchOptionsKey:Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.overrideUserInterfaceStyle = ${UI_STYLE}

                  let root = UIViewController()
                  root.view.backgroundColor = .black

                  let noSplash = "${{ github.event.inputs.no_splash }}" == "true"
                  let isLocal  = "${{ github.event.inputs.use_local_html }}" == "true"
                  let webUrl   = "${{ github.event.inputs.web_url }}"

                  // ── WebView Setup ───────────────────────────────────
                  let cfg = WKWebViewConfiguration()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []

                  let vpSrc = """
                      (function(){
                        var m=document.createElement('meta');
                        m.name='viewport';
                        m.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no';
                        document.head.appendChild(m);
                        var s=document.createElement('style');
                        s.textContent='::-webkit-scrollbar{display:none}body{-webkit-overflow-scrolling:touch;overscroll-behavior:none}';
                        document.head.appendChild(s);
                      })();
                  """
                  cfg.userContentController.addUserScript(
                      WKUserScript(source: vpSrc, injectionTime: .atDocumentEnd, forMainFrameOnly: false))

                  webView = WKWebView(frame: UIScreen.main.bounds, configuration: cfg)
                  webView.autoresizingMask = [.flexibleWidth,.flexibleHeight]
                  webView.scrollView.bounces = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  webView.scrollView.showsVerticalScrollIndicator   = false
                  webView.isOpaque = false
                  webView.backgroundColor = .black
                  webView.scrollView.backgroundColor = .black
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.addObserver(self, forKeyPath: #keyPath(WKWebView.estimatedProgress),
                                      options: .new, context: nil)

                  // Progress bar vàng TqDz
                  progressBar = UIView(frame: CGRect(x:0, y:0, width:0, height:3))
                  progressBar.backgroundColor = UIColor(red:212/255, green:175/255, blue:55/255, alpha:1)
                  progressBar.layer.cornerRadius = 1.5
                  progressBar.layer.shadowColor  = UIColor(red:212/255,green:175/255,blue:55/255,alpha:1).cgColor
                  progressBar.layer.shadowRadius = 4
                  progressBar.layer.shadowOpacity = 0.8

                  root.view.addSubview(webView)
                  root.view.addSubview(progressBar)

                  if isLocal {
                      if let p = Bundle.main.path(forResource:"index",ofType:"html") {
                          let u = URL(fileURLWithPath: p)
                          webView.loadFileURL(u, allowingReadAccessTo: u.deletingLastPathComponent())
                      }
                  } else if !webUrl.isEmpty, let u = URL(string: webUrl) {
                      var req = URLRequest(url: u, cachePolicy: .returnCacheDataElseLoad)
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")
                      webView.load(req)
                  }

                  window?.rootViewController = root
                  window?.makeKeyAndVisible()

                  // ── Splash overlay — chỉ hiện khi NO_SPLASH = false ─
                  if !noSplash {
                      splashView = SplashView(frame: UIScreen.main.bounds)
                      window?.addSubview(splashView)
                      splashView.animate { [weak self] in
                          self?.splashView.removeFromSuperview()
                      }
                  }
                  return true
              }

              override func observeValue(forKeyPath k: String?, of o: Any?,
                                         change: [NSKeyValueChangeKey:Any]?, context: UnsafeMutableRawPointer?) {
                  guard k == "estimatedProgress" else { return }
                  let p = CGFloat(webView.estimatedProgress)
                  UIView.animate(withDuration: 0.2) {
                      self.progressBar.frame.size.width = UIScreen.main.bounds.width * p
                  }
                  if webView.estimatedProgress >= 1.0 {
                      UIView.animate(withDuration:0.4, delay:0.5) { self.progressBar.alpha=0 }
                      completion: { _ in self.progressBar.alpha=1; self.progressBar.frame.size.width=0 }
                  }
              }

              func webView(_ wv: WKWebView, decidePolicyFor action: WKNavigationAction,
                           decisionHandler: @escaping (WKNavigationActionPolicy)->Void) {
                  if action.navigationType == .linkActivated,
                     let u = action.request.url, u.scheme != "http", u.scheme != "https" {
                      UIApplication.shared.open(u); decisionHandler(.cancel); return
                  }
                  decisionHandler(.allow)
              }
              func webView(_ wv: WKWebView, runJavaScriptAlertPanelWithMessage msg: String,
                           initiatedByFrame f: WKFrameInfo, completionHandler: @escaping ()->Void) {
                  let a = UIAlertController(title:"Thông báo", message:msg, preferredStyle:.alert)
                  a.addAction(UIAlertAction(title:"OK",style:.default){_ in completionHandler()})
                  window?.rootViewController?.present(a, animated:true)
              }
          }

          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          // SplashView — Logo TqModes animated khi mở app
          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          class SplashView: UIView {
              private let logoView   = UIImageView()
              private let titleLabel = UILabel()
              private let subtitleLabel = UILabel()
              private let glowLayer  = CALayer()

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  backgroundColor = UIColor.black

                  // Logo
                  if let img = UIImage(named:"LaunchImage") {
                      let cropped = centerCrop(img, to: CGSize(width:200, height:200))
                      logoView.image = cropped
                  } else {
                      // Fallback: emoji ⚜️
                      let label = UILabel(frame: CGRect(x:0,y:0,width:200,height:200))
                      label.text = "⚜️"; label.font = .systemFont(ofSize:120)
                      label.textAlignment = .center
                      addSubview(label)
                      label.center = CGPoint(x: bounds.midX, y: bounds.midY - 60)
                  }
                  logoView.contentMode = .scaleAspectFit
                  logoView.frame       = CGRect(x:0,y:0,width:200,height:200)
                  logoView.center      = CGPoint(x: bounds.midX, y: bounds.midY - 60)
                  logoView.alpha       = 0
                  logoView.transform   = CGAffineTransform(scaleX:0.3, y:0.3)
                  addSubview(logoView)

                  // Glow effect
                  logoView.layer.shadowColor   = UIColor(red:212/255,green:175/255,blue:55/255,alpha:1).cgColor
                  logoView.layer.shadowRadius  = 30
                  logoView.layer.shadowOpacity = 0
                  logoView.layer.shadowOffset  = .zero

                  // Title
                  titleLabel.text          = "${{ github.event.inputs.app_name }}"
                  titleLabel.font          = UIFont.systemFont(ofSize: 38, weight: .bold)
                  titleLabel.textColor     = UIColor(red:212/255, green:175/255, blue:55/255, alpha:1)
                  titleLabel.textAlignment = .center
                  titleLabel.alpha         = 0
                  titleLabel.frame         = CGRect(x:20, y:0, width:bounds.width-40, height:50)
                  titleLabel.center        = CGPoint(x: bounds.midX, y: bounds.midY + 120)
                  addSubview(titleLabel)

                  // Subtitle
                  subtitleLabel.text          = "⚜️ TqDz MAXIMA v4"
                  subtitleLabel.font          = UIFont.systemFont(ofSize:16, weight:.medium)
                  subtitleLabel.textColor     = UIColor(white:1, alpha:0.4)
                  subtitleLabel.textAlignment = .center
                  subtitleLabel.alpha         = 0
                  subtitleLabel.frame         = CGRect(x:20,y:0,width:bounds.width-40,height:30)
                  subtitleLabel.center        = CGPoint(x: bounds.midX, y: bounds.midY + 172)
                  addSubview(subtitleLabel)
              }

              func animate(completion: @escaping ()->Void) {
                  // Phase 1: Logo xuất hiện với bounce
                  UIView.animate(withDuration:0.7, delay:0.1,
                                 usingSpringWithDamping:0.6, initialSpringVelocity:0.8) {
                      self.logoView.alpha     = 1
                      self.logoView.transform = .identity
                      self.logoView.layer.shadowOpacity = 0.9
                  }
                  // Phase 2: Text fade in
                  UIView.animate(withDuration:0.5, delay:0.6) {
                      self.titleLabel.alpha    = 1
                      self.subtitleLabel.alpha = 1
                  }
                  // Phase 3: Pulse logo
                  DispatchQueue.main.asyncAfter(deadline:.now()+1.2) {
                      UIView.animate(withDuration:0.3,
                                     animations: { self.logoView.transform = CGAffineTransform(scaleX:1.08,y:1.08) },
                                     completion: { _ in
                          UIView.animate(withDuration:0.2) { self.logoView.transform = .identity }
                      })
                  }
                  // Phase 4: Fade out
                  UIView.animate(withDuration:0.5, delay:2.2) {
                      self.alpha = 0
                  } completion: { _ in completion() }
              }

              private func centerCrop(_ img: UIImage, to size: CGSize) -> UIImage {
                  let renderer = UIGraphicsImageRenderer(size: size)
                  return renderer.image { ctx in
                      let scale = max(size.width/img.size.width, size.height/img.size.height)
                      let scaledW = img.size.width * scale
                      let scaledH = img.size.height * scale
                      let x = (size.width  - scaledW) / 2
                      let y = (size.height - scaledH) / 2
                      img.draw(in: CGRect(x:x,y:y,width:scaledW,height:scaledH))
                  }
              }
              required init?(coder: NSCoder) { fatalError() }
          }


          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          SWIFTEOF

          # ── Info.plist ─────────────────────────────────────────
          cat << EOF > AppSource/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleName</key><string>${APP_NAME}</string>
              <key>CFBundleDisplayName</key><string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key><string>${BUNDLE_PREFIX}.${SAFE_NAME}.${{ github.run_id }}</string>
              <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
              <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
              <key>CFBundleIconName</key><string>AppIcon</string>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarStyle</key><string>UIStatusBarStyleLightContent</string>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIUserInterfaceStyle</key><string>${UI_PLIST}</string>
          </dict></plist>
          EOF

          # ── LaunchScreen.storyboard dùng ảnh LaunchImage.png ──
          cat << EOF > AppSource/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
                    version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch"
                    propertyAccessControl="none" useAutolayout="YES" launchScreen="YES"
                    useTraitCollections="YES" useSafeAreas="YES" initialViewController="VC1">
            <dependencies>
              <deployment identifier="iOS"/>
              <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
            </dependencies>
            <scenes>
              <scene sceneID="SC1">
                <objects>
                  <viewController id="VC1" sceneMemberID="viewController">
                    <view key="view" contentMode="scaleToFill" id="V1">
                      <rect key="frame" x="0" y="0" width="393" height="852"/>
                      <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                      <subviews>
                        <imageView clipsSubviews="YES" userInteractionEnabled="NO"
                                   contentMode="scaleAspectFill" image="LaunchImage"
                                   translatesAutoresizingMaskIntoConstraints="NO" id="IV1">
                          <rect key="frame" x="0" y="0" width="393" height="852"/>
                        </imageView>
                      </subviews>
                      <color key="backgroundColor" white="0" alpha="1"
                             colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                      <constraints>
                        <constraint firstItem="IV1" firstAttribute="top" secondItem="V1" secondAttribute="top" id="c1"/>
                        <constraint firstItem="IV1" firstAttribute="bottom" secondItem="V1" secondAttribute="bottom" id="c2"/>
                        <constraint firstItem="IV1" firstAttribute="leading" secondItem="V1" secondAttribute="leading" id="c3"/>
                        <constraint firstItem="IV1" firstAttribute="trailing" secondItem="V1" secondAttribute="trailing" id="c4"/>
                      </constraints>
                    </view>
                  </viewController>
                  <placeholder placeholderIdentifier="IBFirstResponder" id="IBR1" sceneMemberID="firstResponder"/>
                </objects>
                <point key="canvasLocation" x="53" y="375"/>
              </scene>
            </scenes>
            <resources>
              <image name="LaunchImage" width="1242" height="2208"/>
            </resources>
          </document>
          EOF

      - name: "7️⃣b  LaunchScreen theo chế độ no_splash"
        run: |
          if [ "${{ github.event.inputs.no_splash }}" == "true" ]; then
            # ── No Splash: LaunchScreen đen tuyệt đối, không text, không ảnh ──
            cat << 'EOF' > AppSource/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0"
                    toolsVersion="21507" targetRuntime="iOS.CocoaTouch"
                    propertyAccessControl="none" useAutolayout="YES" launchScreen="YES"
                    useTraitCollections="YES" useSafeAreas="YES" initialViewController="VC1">
            <dependencies>
              <deployment identifier="iOS"/>
              <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
            </dependencies>
            <scenes>
              <scene sceneID="SC1">
                <objects>
                  <viewController id="VC1" sceneMemberID="viewController">
                    <view key="view" contentMode="scaleToFill" id="V1">
                      <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                      <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                      <color key="backgroundColor" white="0.0" alpha="1.0"
                             colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                    </view>
                  </viewController>
                  <placeholder placeholderIdentifier="IBFirstResponder" id="FR1" sceneMemberID="firstResponder"/>
                </objects>
              </scene>
            </scenes>
          </document>
          EOF
            echo "✅ LaunchScreen: đen tuyệt đối (no_splash mode)"
          else
            echo "✅ LaunchScreen: dùng ảnh TqModes (splash mode)"
          fi

      - name: "8️⃣  Copy HTML & Generate Xcode Project"
        run: |
          if [ "${{ github.event.inputs.use_local_html }}" == "true" ] && [ -f "index.html" ]; then
            cp index.html AppSource/
          fi
          xcodegen generate
          echo "✅ Project: ${SAFE_NAME}.xcodeproj"

      - name: "9️⃣  Biên dịch & Sign IPA"
        run: |
          set -e
          xcodebuild -project "${SAFE_NAME}.xcodeproj"                      -scheme "${SAFE_NAME}"                      -sdk iphoneos                      -configuration Release                      CODE_SIGN_IDENTITY=""                      CODE_SIGNING_REQUIRED=NO                      CODE_SIGNING_ALLOWED=NO                      SYMROOT=$(pwd)/build                      2>&1 | tee BuildLogs/build.log | grep -E "(error:|Build succeeded|Build FAILED)" || true

          APP_BUNDLE="build/Release-iphoneos/${SAFE_NAME}.app"
          [ ! -d "$APP_BUNDLE" ] && { echo "❌ Build thất bại!"; tail -80 BuildLogs/build.log; exit 1; }

          mkdir -p Payload && cp -r "$APP_BUNDLE" Payload/
          ldid -S "Payload/${SAFE_NAME}.app/${SAFE_NAME}"

          BUILD_TYPE=$( [ "$NO_SPLASH" = "true" ] && echo "NoSplash" || echo "Splash" )
          IPA_NAME="${APP_NAME// /_}_v${APP_VERSION}_${BUILD_TYPE}.ipa"
          zip -qr "$IPA_NAME" Payload/
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "✅ $IPA_NAME ($(du -sh $IPA_NAME | cut -f1))"

      - name: "🔟  Tạo Python Companion Script"
        run: |
          python3 << PYEOF
          import os, base64
          from datetime import datetime

          app_name = os.environ["APP_NAME"]
          version  = os.environ["APP_VERSION"]
          safe     = os.environ["SAFE_NAME"]
          btype    = os.environ.get("BUILD_TYPE","Web")
          run_id   = "${{ github.run_id }}"
          run_num  = "${{ github.run_number }}"
          now      = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          icon_path = "AppSource/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
          icon_b64  = base64.b64encode(open(icon_path,"rb").read()).decode() if os.path.exists(icon_path) else ""

          script = f"""#!/usr/bin/env python3
          # ⚜️═══════════════════════════════════════════════════⚜️
          #   TqDz MAXIMA v4 — Companion Script
          #   {app_name} v{version} ({btype} Build)
          #   Build #{run_num} | {now}
          # ⚜️═══════════════════════════════════════════════════⚜️
          import os, sys, base64, hashlib, json, io
          from datetime import datetime

          APP  = dict(name="{app_name}", version="{version}", build="{run_num}",
                      run_id="{run_id}", build_type="{btype}", built="{now}",
                      engine="TqDz MAXIMA v4")
          ICON = "{icon_b64}"

          def info():
              print("⚜️  TqDz MAXIMA v4 — App Companion")
              print("─"*44)
              for k,v in APP.items(): print(f"  {{k:<12}}: {{v}}")
              print("─"*44)

          def icon(out="app_icon.png"):
              if not ICON: print("❌ Không có icon"); return
              d = base64.b64decode(ICON)
              open(out,"wb").write(d)
              print(f"✅ Icon: {{out}} ({{len(d)/1024:.1f}} KB)")
              try:
                  from PIL import Image
                  im = Image.open(out)
                  print(f"   Kích thước: {{im.size[0]}}x{{im.size[1]}}")
              except: pass

          def verify(path):
              if not os.path.exists(path): print(f"❌ {{path}} không tồn tại"); return
              d = open(path,"rb").read()
              print(f"📱 {{path}}")
              print(f"   Size  : {{len(d)/1024/1024:.2f}} MB")
              print(f"   MD5   : {{hashlib.md5(d).hexdigest()}}")
              print(f"   SHA256: {{hashlib.sha256(d).hexdigest()}}")
              print("   Format: " + ("✅ ZIP/IPA" if d[:4]==b"PK\x03\x04" else "⚠️ Bất thường"))

          def upload_icon(service="imgur"):
              \"\"\"Upload icon lên hosting lấy link public\"\"\"
              if not ICON: print("❌ Không có icon"); return
              d = base64.b64decode(ICON)
              if service == "imgur":
                  import urllib.request, urllib.parse
                  data = urllib.parse.urlencode({{"image": ICON, "type":"base64",
                          "title":f"{{APP['name']}} Icon"}}).encode()
                  req  = urllib.request.Request("https://api.imgur.com/3/image",
                          data=data, headers={{"Authorization":"Client-ID 546c25a59c58ad7"}})
                  try:
                      res  = urllib.request.urlopen(req, timeout=20)
                      resp = json.loads(res.read())
                      if resp.get("success"):
                          url = resp["data"]["link"]
                          dh  = resp["data"]["deletehash"]
                          print(f"✅ Imgur upload OK!")
                          print(f"🔗 Link: {{url}}")
                          print(f"🗑️  Delete: https://imgur.com/delete/{{dh}}")
                          with open("icon_link.json","w") as f:
                              json.dump({{"url":url,"deletehash":dh,"app":APP["name"]}},f,indent=2)
                          print("💾 Đã lưu: icon_link.json")
                          return url
                      else: print("❌ Imgur lỗi:", resp)
                  except Exception as e: print(f"❌ {{e}}")
              elif service == "catbox":
                  import urllib.request, urllib.parse
                  import mimetypes, email.mime.multipart, email.mime.base, email.encoders
                  # catbox.moe upload
                  boundary = b"TqDzBoundary"
                  body = (b"--TqDzBoundary\r\nContent-Disposition: form-data; name=\"reqtype\"\r\n\r\nfileupload\r\n"
                          b"--TqDzBoundary\r\nContent-Disposition: form-data; name=\"fileToUpload\"; filename=\"icon.png\"\r\n"
                          b"Content-Type: image/png\r\n\r\n" + d + b"\r\n--TqDzBoundary--")
                  req = urllib.request.Request("https://catbox.moe/user/api.php", data=body,
                          headers={{"Content-Type":"multipart/form-data; boundary=TqDzBoundary"}})
                  try:
                      res = urllib.request.urlopen(req, timeout=20).read().decode()
                      if res.startswith("https://"):
                          print(f"✅ Catbox OK!\n🔗 {{res}}")
                          return res
                      else: print("❌ Catbox:", res)
                  except Exception as e: print(f"❌ {{e}}")

          if __name__=="__main__":
              info()
              cmd = sys.argv[1] if len(sys.argv)>1 else ""
              if cmd=="icon": icon(sys.argv[2] if len(sys.argv)>2 else "app_icon.png")
              elif cmd=="verify": verify(sys.argv[2]) if len(sys.argv)>2 else print("verify <file.ipa>")
              elif cmd=="upload": upload_icon(sys.argv[2] if len(sys.argv)>2 else "imgur")
              else: print("\n💡 Lệnh:\n  python3 companion.py icon [output.png]\n  python3 companion.py verify app.ipa\n  python3 companion.py upload [imgur|catbox]")
          """
          with open(f"{safe}_companion.py","w") as f: f.write(script)
          print(f"✅ Companion: {safe}_companion.py")
          PYEOF

      - name: "1️⃣1️⃣  Upload Icon → Imgur & Catbox"
        run: |
          python3 << PYEOF
          import os, base64, json, urllib.request, urllib.parse

          icon_path = "AppSource/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
          gen_path  = "AppIcon_generated.png"
          path      = icon_path if os.path.exists(icon_path) else gen_path
          if not os.path.exists(path): print("⚠️ No icon"); exit(0)

          raw   = open(path,"rb").read()
          b64   = base64.b64encode(raw).decode()
          results = {}

          # ── Imgur ─────────────────────────────────────────────
          try:
              data = urllib.parse.urlencode({"image":b64,"type":"base64",
                     "title":f"TqDz Icon - {os.environ.get('APP_NAME','App')}"}).encode()
              req  = urllib.request.Request("https://api.imgur.com/3/image", data=data,
                     headers={"Authorization":"Client-ID 546c25a59c58ad7"})
              res  = json.loads(urllib.request.urlopen(req,timeout=25).read())
              if res.get("success"):
                  results["imgur_url"]    = res["data"]["link"]
                  results["imgur_delete"] = res["data"]["deletehash"]
                  print(f"✅ Imgur: {results['imgur_url']}")
                  with open(os.environ["GITHUB_ENV"],"a") as f:
                      f.write(f"IMGUR_URL={results['imgur_url']}
")
              else: print("⚠️ Imgur fail:", res)
          except Exception as e: print(f"⚠️ Imgur: {e}")

          # ── Catbox.moe (backup) ───────────────────────────────
          try:
              body = (b"--Bnd
Content-Disposition: form-data; name="reqtype"

fileupload
"
                      b"--Bnd
Content-Disposition: form-data; name="fileToUpload"; filename="icon.png"
"
                      b"Content-Type: image/png

" + raw + b"
--Bnd--")
              req2 = urllib.request.Request("https://catbox.moe/user/api.php", data=body,
                     headers={"Content-Type":"multipart/form-data; boundary=Bnd"})
              res2 = urllib.request.urlopen(req2, timeout=25).read().decode().strip()
              if res2.startswith("https://"):
                  results["catbox_url"] = res2
                  print(f"✅ Catbox: {res2}")
                  with open(os.environ["GITHUB_ENV"],"a") as f:
                      f.write(f"CATBOX_URL={res2}
")
              else: print("⚠️ Catbox:", res2[:100])
          except Exception as e: print(f"⚠️ Catbox: {e}")

          results["app"]   = os.environ.get("APP_NAME","App")
          results["build"] = os.environ.get("GITHUB_RUN_NUMBER","?")
          results["size_kb"] = round(len(raw)/1024,1)
          with open("imgur_result.json","w") as f: json.dump(results,f,indent=2)
          print("💾 imgur_result.json saved")
          PYEOF

      - name: "1️⃣2️⃣  Upload Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_id }}"
          name: "⚜️ TqDz MAXIMA v4 — ${{ github.event.inputs.app_name }} v${{ github.event.inputs.app_version }} [${{ github.event.inputs.no_splash == 'true' && 'NoSplash' || 'Splash' }}]"
          body: |
            ## ⚜️ TqDz MAXIMA v4 Build Report

            | | |
            |---|---|
            | 📱 **App** | `${{ github.event.inputs.app_name }}` v`${{ github.event.inputs.app_version }}` |
            | 📦 **Build Type** | `${{ github.event.inputs.no_splash == 'true' && '⚫ No Splash (vào thẳng)' || '✨ Có Splash TqModes' }}` |
            | 🔨 **Build #** | `${{ github.run_number }}` |
            | 🌙 **Dark Mode** | `${{ github.event.inputs.dark_mode }}` |
            | 🌐 **URL** | `${{ github.event.inputs.web_url || 'Local HTML / Pure' }}` |
            | 🖼 **Imgur Icon** | ${{ env.IMGUR_URL && format('[Link]({0})', env.IMGUR_URL) || 'N/A' }} |
            | 🖼 **Catbox Icon** | ${{ env.CATBOX_URL && format('[Link]({0})', env.CATBOX_URL) || 'N/A' }} |

            ## 🚀 Cài đặt
            - **TrollStore** / **ESign** / **AltStore**: Import file `.ipa`

            ---
            *⚜️ TqDz MAXIMA v4 Engine — Splash TqModes | Auto Icon | Pure Mode*
          files: |
            *.ipa
            *_companion.py
            imgur_result.json
            AppIcon_generated.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "1️⃣3️⃣  Summary"
        if: always()
        run: |
          echo "⚜️══════════════════════════════════════⚜️"
          echo "  TqDz MAXIMA v4 — BUILD COMPLETE"
          echo "⚜️══════════════════════════════════════⚜️"
          echo "📱 $APP_NAME v$APP_VERSION [$BUILD_TYPE]"
          echo "📦 $IPA_NAME"
          echo "🖼 Imgur : ${IMGUR_URL:-N/A}"
          echo "🖼 Catbox: ${CATBOX_URL:-N/A}"
          ls -lh *.ipa 2>/dev/null || echo "⚠️ No IPA"
          echo "⚜️══════════════════════════════════════⚜️"
