name: TqModes Build IPA
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Tên hiển thị của App'
        default: 'TqModes'
        required: true
      web_url:
        description: 'Link website'
        default: 'http://makefile.great-site.net/'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create IPA Structure
        run: |
          mkdir -p Payload/App.app
          # Tạo file chuyển hướng link web
          echo "<html><head><meta charset='UTF-8'></head><script>window.location='${{ github.event.inputs.web_url }}'</script></html>" > Payload/App.app/index.html
          # Đóng gói thành IPA
          zip -r "${{ github.event.inputs.app_name }}.ipa" Payload/
          
      - name: Export IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA_THANH_PHAM
          path: ./*.ipa
